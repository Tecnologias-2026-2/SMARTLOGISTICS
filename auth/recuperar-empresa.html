<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña · Smart Logistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
  <script src="../js/accesibilidad.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido principal</a>
  <!-- Figma: nodo 9:1512 -->
  <main class="auth-center" id="contenido" tabindex="-1">
    <div class="auth-box">
      <a href="../index.html" class="logo">
          <span class="logo__mark">SL</span>
          <span class="logo__text">
            <span class="logo__title">SMART</span>
            <span class="logo__subtitle">LOGISTICS</span>
          </span>
        </a>
      <div class="auth-head">
        <h1 class="auth-title">Recuperar contraseña</h1>
        <p class="auth-head__text">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
      </div>

      <form class="form form--recover" method="post" novalidate data-auth-form="recover" data-next="correo-enviado-empresa.html">
          <div class="field">
            <label class="field__label" for="email">Correo electrónico</label>
            <input class="input" id="email" name="email" type="email" placeholder="tu@correo.com" autocomplete="email" required>
          </div>
        <button type="submit" class="btn btn--primary btn--lg btn--block">Enviar enlace de recuperación</button>
        <p class="back-link back-link--lg"><a href="login-empresa.html">← Volver al inicio de sesión</a></p>
      </form>
    </div>
  </main>
  <script src="../js/auth.js"></script>
</body>
</html>
