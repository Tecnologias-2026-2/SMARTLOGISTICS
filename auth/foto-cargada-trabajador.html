<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotografía cargada · Smart Logistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <!-- Figma: nodo 9:2202 -->
  <main class="auth-center">
    <div class="auth-box auth-box--wide">
      <a href="../index.html" class="logo">
          <span class="logo__mark">SL</span>
          <span class="logo__text">
            <span class="logo__title">SMART</span>
            <span class="logo__subtitle">LOGISTICS</span>
          </span>
        </a>
      <div class="auth-head auth-head--center auth-head--tight">

        <p class="auth-head__text">Una buena fotografía aumenta hasta un 80% tus probabilidades de ser seleccionado por las empresas.</p>
      </div>

      <section class="photo-card">
        <div class="photo-done">
          <span class="photo-done__avatar">👤</span>
          <p class="photo-done__title">¡Fotografía cargada!</p>
          <p class="photo-done__text">Tu foto se ve excelente.</p>

        <div class="actions">
          <!-- TODO: enlazar al perfil del trabajador cuando exista -->
          <a href="#" class="btn btn--primary btn--block">Continuar al perfil</a>
