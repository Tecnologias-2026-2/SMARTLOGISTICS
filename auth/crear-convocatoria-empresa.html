<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear convocatoria · Smart Logistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/trabajador.css">
  <link rel="stylesheet" href="../css/crear-convocatoria-empresa.css">
</head>
<body class="worker-dashboard">
  <div class="dashboard">
    <aside class="sidebar">
      <a href="inicio-empresa.html" class="logo sidebar__logo" aria-label="Smart Logistics, ir al inicio">
        <span class="logo__mark" aria-hidden="true">SL</span>
        <span class="logo__text" aria-hidden="true">
          <span class="logo__title">SMART</span>
          <span class="logo__subtitle">LOGISTICS</span>
        </span>
      </a>

      <a href="perfil-empresa.html" class="sidebar__profile">
        <span class="sidebar__avatar" aria-hidden="true">🏢</span>
        <span class="sidebar__identity">
          <strong>Eventos Nova</strong>
          <span>Coordinador de empresa</span>
        </span>
      </a>

      <nav class="sidebar__nav" aria-label="Navegación de la empresa">
        <a class="sidebar__link" href="inicio-empresa.html"><span aria-hidden="true">🏠</span>Inicio</a>
        <a class="sidebar__link" href="convocatorias-empresa.html"><span aria-hidden="true">📣</span>Convocatorias</a>
        <a class="sidebar__link sidebar__link--active" href="crear-convocatoria-empresa.html" aria-current="page"><span aria-hidden="true">➕</span>Crear</a>
        <a class="sidebar__link" href="candidatos-empresa.html"><span aria-hidden="true">👥</span>Candidatos</a>
        <a class="sidebar__link" href="perfil-empresa.html"><span aria-hidden="true">🏢</span>Empresa</a>
      </nav>

      <div class="sidebar__footer">
        <span class="session-pill"><span aria-hidden="true">•</span> Sesión de empresa</span>
        <a class="sidebar__link sidebar__logout" href="login-empresa.html"><span aria-hidden="true">📜</span>Cerrar sesión</a>
      </div>
    </aside>

    <main class="dashboard__main create-form-main">
      <header class="create-form-header">
        <h1>Crear convocatoria</h1>
        <p>Publica una nueva necesidad de personal logístico</p>
      </header>

      <form class="create-form-panel" action="#" method="post">
        <section class="form-block">
          <h2>Información del trabajo</h2>

          <div class="field-group">
            <label for="job-title">Cargo / título <span aria-hidden="true">*</span></label>
            <input id="job-title" name="job-title" type="text" value="Auxiliares de Montaje - Feria Tecnológica" />
          </div>

          <div class="field-row two-columns">
            <div class="field-group">
              <label for="category">Categoría <span aria-hidden="true">*</span></label>
              <select id="category" name="category">
                <option selected>Selecciona una categoría</option>
                <option>Montaje</option>
                <option>Logística</option>
                <option>Evento</option>
                <option>Almacén</option>
              </select>
            </div>

            <div class="field-group">
              <label for="workers">N.º de trabajadores <span aria-hidden="true">*</span></label>
              <input id="workers" name="workers" type="number" value="10" />
            </div>
          </div>

          <div class="field-group">
            <label for="location">Ubicación <span aria-hidden="true">*</span></label>
            <input id="location" name="location" type="text" value="Ej: Bogotá, Corferias" />
          </div>
        </section>

        <section class="form-block">
          <h2>Fecha y horario</h2>

          <div class="field-group">
            <label for="date">Fecha <span aria-hidden="true">*</span></label>
            <input id="date" name="date" type="date" />
          </div>

          <div class="field-row two-columns">
            <div class="field-group">
              <label for="start-time">Hora inicio <span aria-hidden="true">*</span></label>
              <input id="start-time" name="start-time" type="time" />
            </div>

            <div class="field-group">
              <label for="end-time">Hora fin <span aria-hidden="true">*</span></label>
              <input id="end-time" name="end-time" type="time" />
            </div>
          </div>
        </section>

        <section class="form-block">
          <h2>Remuneración</h2>

          <div class="field-group">
            <label for="salary">Pago por trabajador <span aria-hidden="true">*</span></label>
            <input id="salary" name="salary" type="text" value="Ej: $80.000 COP" />
          </div>
        </section>

        <section class="form-block">
          <h2>Descripción y requisitos</h2>

          <div class="field-group">
            <label for="description">Descripción del trabajo <span aria-hidden="true">*</span></label>
            <textarea id="description" name="description" rows="4">Describe las actividades y responsabilidades del puesto...</textarea>
          </div>

          <div class="field-group">
            <label for="requirements">Requisitos (opcional)</label>
            <textarea id="requirements" name="requirements" rows="3">Ej: Experiencia mínima de 1 año, disponibilidad completa...</textarea>
          </div>
        </section>

        <div class="button-row">
          <button type="button" class="btn btn--outline btn--cancel">Cancelar</button>
          <button type="submit" class="btn btn--primary btn--submit">Publicar convocatoria</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
